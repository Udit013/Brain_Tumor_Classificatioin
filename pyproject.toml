[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-production"
version = "0.1.0"
description = "Production extension of the IEEE 2024 EfficientNetB3 brain-tumor classifier"
readme = "README.md"
requires-python = ">=3.9,<3.12"   # bounded by TensorFlow 2.15

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy", "*.ipynb"]

[tool.ruff.lint]
# Explicit, so the result does not change with ruff's defaults (CI pins ruff).
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E702"]   # compact one-line fixture setup
