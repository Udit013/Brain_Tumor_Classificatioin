# Local full stack: PostgreSQL + pgvector, the platform API, the web app.
#   docker compose -f deploy/docker-compose.yml up --build
# Then open http://localhost:3000 (API docs: http://localhost:8000/docs).
services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: neuroclass
      POSTGRES_PASSWORD: neuroclass
      POSTGRES_DB: neuroclass
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroclass"]
      interval: 5s
      retries: 20

  api:
    build: { context: .., dockerfile: Dockerfile.api }
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://neuroclass:neuroclass@db:5432/neuroclass
      NEUROCLASS_JWT_SECRET: ${NEUROCLASS_JWT_SECRET:-change-me-local-only-0123456789abcdef}
      NEUROCLASS_REVIEWER_EMAILS: ${NEUROCLASS_REVIEWER_EMAILS:-reviewer@example.org}
      # local only; a listed email must also present this code to become a reviewer
      NEUROCLASS_REVIEWER_CODE: ${NEUROCLASS_REVIEWER_CODE:-local-reviewer-code-change-me}
      NEUROCLASS_CORS_ORIGINS: http://localhost:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    # migrate, load the literature index into pgvector, then serve
    command: >
      sh -c "python -m neuroclass.db.migrate && python -m neuroclass.rag.store load &&
             uvicorn neuroclass.api.app:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    volumes: [uploads:/var/lib/neuroclass]

  web:
    build:
      context: ../web
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
  uploads:
